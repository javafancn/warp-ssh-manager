name: 构建 macOS 安装包（Intel / Apple 芯片分开）

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }} 安装包
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            rust_target: aarch64-apple-darwin
            arch: apple-silicon
          - name: Intel
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            arch: intel
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - name: Show architecture and SDK
        run: |
          sw_vers
          uname -m
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Test SSH core
        run: cargo test -p wsm-core
      - name: Build macOS desktop
        shell: bash
        run: |
          set -o pipefail
          cargo build -p wsm-desktop --release --features tray --target ${{ matrix.rust_target }} 2>&1 | tee build.log
      - name: Save build errors
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 编译诊断-${{ matrix.arch }}
          path: build.log
          if-no-files-found: warn
      - name: Package installable DMG with Applications shortcut
        shell: bash
        run: |
          set -o pipefail
          bash scripts/package-macos-app.sh --single \
            target/${{ matrix.rust_target }}/release/warp-ssh-manager ${{ matrix.arch }} 2>&1 | tee package.log
      - name: Save packaging errors
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 打包诊断-${{ matrix.arch }}
          path: package.log
          if-no-files-found: warn
      - name: Upload separate DMG installer
        uses: actions/upload-artifact@v4
        with:
          name: WarpSSHManager-DMG-${{ matrix.arch }}-macOS12
          path: dist/WarpSSHManager-0.3.3-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 30
