name: 构建 macOS 原生安装包（SwiftUI + Rust）
on:
  workflow_dispatch:
  push:
    branches: [main, feature/ssh-credentials-ui, feature/nested-groups, feature/spotlight-quick-launcher, fix/reusable-tags-and-transient-notices, fix/keep-running-in-menu-bar, feat/interface-language-settings]
    tags: ['v*']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package:
    name: ${{ matrix.name }} 原生安装包
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            rust_target: aarch64-apple-darwin
            swift_target: arm64-apple-macos12.0
            arch: apple-silicon
          - name: Intel
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            swift_target: x86_64-apple-macos12.0
            arch: intel
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - name: Show macOS toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun swiftc -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: swiftui-${{ matrix.arch }}
      - name: Test Rust SSH core and JSON bridge
        run: cargo test -p wsm-core -p wsm-cli
      - name: Build bundled Rust SSH core
        shell: bash
        run: |
          set -o pipefail
          cargo build -p wsm-cli --release --target ${{ matrix.rust_target }} 2>&1 | tee rust-build.log
      - name: Smoke test native UI Rust JSON bridge
        run: bash scripts/native-ui-bridge-smoke.sh target/${{ matrix.rust_target }}/release/wsm
      - name: Compile native SwiftUI / AppKit application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          xcrun swiftc -O -target ${{ matrix.swift_target }} \
            -framework SwiftUI -framework AppKit \
            apps/wsm-native/Sources/*.swift \
            -o dist/warp-ssh-manager 2>&1 | tee swift-build.log
      - name: Save build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 原生编译诊断-${{ matrix.arch }}
          path: |
            swift-build.log
            rust-build.log
          if-no-files-found: warn
      - name: Package native macOS application
        shell: bash
        run: |
          set -o pipefail
          bash scripts/package-macos-app.sh --single dist/warp-ssh-manager ${{ matrix.arch }} 2>&1 | tee package.log
      - name: Save packaging errors
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 原生打包诊断-${{ matrix.arch }}
          path: package.log
          if-no-files-found: warn
      - name: Capture actual SwiftUI window (visual smoke, Apple Silicon)
        if: matrix.arch == 'apple-silicon'
        run: bash scripts/native-visual-smoke.sh
      - name: Upload visual smoke screenshot (including failures)
        if: always() && matrix.arch == 'apple-silicon'
        uses: actions/upload-artifact@v4
        with:
          name: native-visual-smoke-macOS
          path: |
            dist/native-macos-render.png
            dist/native-connection-inspector.png
            dist/native-macos-render-warm.png
            dist/native-macos-desktop.png
            dist/native-macos-desktop-warm-with-app.png
            dist/native-ci-backdrop-cool-only.png
            dist/native-ci-backdrop-warm-only.png
            dist/native-backdrop-audit.txt
            dist/native-window-routing-audit.txt
            dist/native-dock-window-count.txt
            dist/native-quick-panel.png
            dist/native-quick-panel-desktop.png
            dist/native-window-seam-audit.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload separate DMG installers
        uses: actions/upload-artifact@v4
        with:
          name: WarpSSHManager-Native-1.0.4-${{ matrix.arch }}-macOS12
          path: dist/WarpSSHManager-1.0.4-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 30

  publish_v1_0_4:
    name: Publish v1.0.4 GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-wsm-v1.0.4
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'version = "1.0.4"' Cargo.toml
          state=""
          for i in $(seq 1 48); do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name == "Rust and SwiftUI checks" and .event == "push")] | first | .conclusion // ""')"
            [[ "$state" == "success" ]] && break
            [[ "$state" == "failure" || "$state" == "cancelled" || "$state" == "timed_out" ]] && { echo "CI failed: $state" >&2; exit 1; }
            sleep 10
          done
          [[ "$state" == "success" ]] || { echo "CI did not pass" >&2; exit 1; }
      - name: Download both macOS DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: WarpSSHManager-Native-1.0.4-*-macOS12
          merge-multiple: true
          path: release-assets
      - name: Verify DMGs and generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/WarpSSHManager-1.0.4-apple-silicon.dmg
          test -s release-assets/WarpSSHManager-1.0.4-intel.dmg
          cd release-assets
          shasum -a 256 WarpSSHManager-1.0.4-apple-silicon.dmg WarpSSHManager-1.0.4-intel.dmg > SHA256SUMS.txt
      - name: Create official v1.0.4 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0.4 already exists, preserving the existing release"
            exit 0
          fi
          # Query the tag ref directly; no tag means an empty SHA, never JSON error text.
          tag_sha="$(git ls-remote --refs --tags origin refs/tags/v1.0.4 | awk '{print $1}')"
          [[ -z "$tag_sha" || "$tag_sha" == "$GITHUB_SHA" ]] || {
            echo "Refusing release: v1.0.4 tag points at $tag_sha" >&2; exit 1;
          }
          cat > release-notes.md <<'NOTES'
          ## Warp SSH Manager v1.0.4

          This release adds an in-app GitHub Release update checker with architecture-aware downloads and keeps the improvements introduced in v1.0.3.

          ### What's new
          - **Software update checks:** Check GitHub's latest stable Release in the sidebar settings or automatically at launch (can be disabled).
          - **Architecture-aware installers:** Open the official Apple Silicon or Intel DMG download link; installation remains manual.
          - **Update safety:** No silent replacement and no modifications to local SSH hosts or credentials.
          - **Interface language:** Choose Simplified Chinese, English, or Follow System; settings persist across restarts.
          - **Menu bar lifecycle:** Closing the main window hides it without exiting; use the menu bar or Dock to restore it.
          - **Host tags:** Reuse tags from previously saved hosts.
          - **Notification behavior:** Successful actions auto-dismiss after approximately 3.2 seconds; errors remain visible.
          - **Spotlight-inspired quick search:** A compact, translucent search panel with host names, addresses and colorful labels.
          - **Global hotkey:** Press **Control + Option + Command + K** (⌃⌥⌘K) to open or dismiss Quick Connect while the app is running, including from other applications. The menu-bar item is a fallback if the shortcut is already reserved.
          - **Smarter placement:** The launcher appears near the top center of the display containing your mouse pointer; supports multiple Spaces and full-screen auxiliary windows.
          - **Keyboard-first navigation:** Search by hostname, SSH alias, IP, tag and group path, browse recent hosts first, navigate with ↑ / ↓, connect with Enter and close with Escape.
          - **Preserved integration:** Connections still launch through Warp and OpenSSH, retaining existing SSH mode selection and Keychain / Askpass behavior.
          - **Updated documentation:** English default [README](https://github.com/javafancn/warp-ssh-manager/blob/main/README.md) and complete [简体中文](https://github.com/javafancn/warp-ssh-manager/blob/main/README.zh-CN.md) guide.

          ### Installation
          Choose the appropriate attached DMG:
          - **Apple Silicon:** WarpSSHManager-1.0.4-apple-silicon.dmg
          - **Intel Mac:** WarpSSHManager-1.0.4-intel.dmg

          Install [Warp Terminal](https://www.warp.dev/) separately. These packages target macOS 12+ and are **ad-hoc signed, not Apple-notarized**. Mac Gatekeeper may require a security confirmation.

          ### Security and compatibility
          This update does not add remote sudo autofill or a new SSH client. The global shortcut uses the native macOS hotkey API and does not request Accessibility or Input Monitoring permissions. Other applications may already claim the shortcut. CI verifies builds and native window routing, but full real-world multi-monitor, hotkey-conflict and Warp SSH enhancement compatibility still requires physical Mac validation.

          ### 中文更新摘要
          v1.0.4 新增应用内检查更新：支持启动时自动检查、手动检查更新、版本提示以及按 Apple Silicon / Intel 下载对应 DMG。手动安装、不触及 SSH 配置与密码。

          Download integrity: Verify the two DMGs against the attached SHA256SUMS.txt.

          NOTES
          gh release create v1.0.4 \
            release-assets/WarpSSHManager-1.0.4-apple-silicon.dmg \
            release-assets/WarpSSHManager-1.0.4-intel.dmg \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Warp SSH Manager v1.0.4" --notes-file release-notes.md --latest
