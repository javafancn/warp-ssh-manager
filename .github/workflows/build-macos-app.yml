name: Build macOS App (Universal 2)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            label: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            label: intel
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Test core
        run: cargo test -p wsm-core
      - name: Build desktop
        run: cargo build --release -p wsm-desktop --features tray --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.label }}
          path: target/${{ matrix.target }}/release/warp-ssh-manager
          if-no-files-found: error
  package:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binary-arm64
          path: staging/arm64
      - uses: actions/download-artifact@v4
        with:
          name: binary-intel
          path: staging/intel
      - name: Package application
        run: bash scripts/package-macos-app.sh --universal staging/arm64/warp-ssh-manager staging/intel/warp-ssh-manager
      - uses: actions/upload-artifact@v4
        with:
          name: WarpSSHManager-Universal2
          path: |
            dist/*.dmg
            dist/*.app.zip
          if-no-files-found: error
