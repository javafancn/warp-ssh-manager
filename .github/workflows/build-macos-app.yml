name: 构建 macOS 原生安装包（SwiftUI + Rust）
on:
  workflow_dispatch:
  push:
    branches: [main, feature/ssh-credentials-ui, feature/nested-groups]
    tags: ['v*']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package:
    name: ${{ matrix.name }} 原生安装包
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            rust_target: aarch64-apple-darwin
            swift_target: arm64-apple-macos12.0
            arch: apple-silicon
          - name: Intel
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            swift_target: x86_64-apple-macos12.0
            arch: intel
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - name: Show macOS toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun swiftc -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: swiftui-${{ matrix.arch }}
      - name: Test Rust SSH core and JSON bridge
        run: cargo test -p wsm-core -p wsm-cli
      - name: Build bundled Rust SSH core
        shell: bash
        run: |
          set -o pipefail
          cargo build -p wsm-cli --release --target ${{ matrix.rust_target }} 2>&1 | tee rust-build.log
      - name: Smoke test native UI Rust JSON bridge
        run: bash scripts/native-ui-bridge-smoke.sh target/${{ matrix.rust_target }}/release/wsm
      - name: Compile native SwiftUI / AppKit application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          xcrun swiftc -O -target ${{ matrix.swift_target }} \
            -framework SwiftUI -framework AppKit \
            apps/wsm-native/Sources/*.swift \
            -o dist/warp-ssh-manager 2>&1 | tee swift-build.log
      - name: Save build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 原生编译诊断-${{ matrix.arch }}
          path: |
            swift-build.log
            rust-build.log
          if-no-files-found: warn
      - name: Package native macOS application
        shell: bash
        run: |
          set -o pipefail
          bash scripts/package-macos-app.sh --single dist/warp-ssh-manager ${{ matrix.arch }} 2>&1 | tee package.log
      - name: Save packaging errors
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 原生打包诊断-${{ matrix.arch }}
          path: package.log
          if-no-files-found: warn
      - name: Capture actual SwiftUI window (visual smoke, Apple Silicon)
        if: matrix.arch == 'apple-silicon'
        run: bash scripts/native-visual-smoke.sh
      - name: Upload visual smoke screenshot (including failures)
        if: always() && matrix.arch == 'apple-silicon'
        uses: actions/upload-artifact@v4
        with:
          name: native-visual-smoke-macOS
          path: |
            dist/native-macos-render.png
            dist/native-connection-inspector.png
            dist/native-macos-render-warm.png
            dist/native-macos-desktop.png
            dist/native-macos-desktop-warm-with-app.png
            dist/native-ci-backdrop-cool-only.png
            dist/native-ci-backdrop-warm-only.png
            dist/native-backdrop-audit.txt
            dist/native-window-routing-audit.txt
            dist/native-dock-window-count.txt
            dist/native-quick-panel.png
            dist/native-quick-panel-desktop.png
            dist/native-window-seam-audit.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload separate DMG installers
        uses: actions/upload-artifact@v4
        with:
          name: WarpSSHManager-Native-1.0.1-${{ matrix.arch }}-macOS12
          path: dist/WarpSSHManager-1.0.1-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 30

  publish_v1_0_1:
    name: Publish v1.0.1 GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-wsm-v1.0.1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'version = "1.0.1"' Cargo.toml
          state=""
          for i in $(seq 1 48); do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name == "Rust and SwiftUI checks" and .event == "push")] | first | .conclusion // ""')"
            [[ "$state" == "success" ]] && break
            [[ "$state" == "failure" || "$state" == "cancelled" || "$state" == "timed_out" ]] && { echo "CI failed: $state" >&2; exit 1; }
            sleep 10
          done
          [[ "$state" == "success" ]] || { echo "CI did not pass" >&2; exit 1; }
      - name: Download both macOS DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: WarpSSHManager-Native-1.0.1-*-macOS12
          merge-multiple: true
          path: release-assets
      - name: Verify DMGs and generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/WarpSSHManager-1.0.1-apple-silicon.dmg
          test -s release-assets/WarpSSHManager-1.0.1-intel.dmg
          cd release-assets
          shasum -a 256 WarpSSHManager-1.0.1-apple-silicon.dmg WarpSSHManager-1.0.1-intel.dmg > SHA256SUMS.txt
      - name: Create official v1.0.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0.1 already exists, preserving the existing release"
            exit 0
          fi
          # gh api can print a JSON 404 payload to stdout when the tag is absent.
          # Keep only a valid 40-character object SHA, never the error response.
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.1" --jq '.object.sha' 2>/dev/null | grep -E '^[0-9a-f]{40}
          [[ -z "$tag_sha" || "$tag_sha" == "$GITHUB_SHA" ]] || {
            echo "Refusing release: v1.0.1 tag points at $tag_sha" >&2; exit 1;
          }
          cat > release-notes.md <<'NOTES'
          ## Warp SSH Manager v1.0.1

          This release brings nested SSH host groups and an improved native macOS interface.

          ### What's new
          - Nested groups with tree expansion, subgroups, group rename and relocation.
          - Parent group filtering and host counts include all descendants.
          - Safeguards against duplicate sibling names, cyclic hierarchy changes, and deleting groups with children.
          - Polished group creation/editing sheet, custom parent picker, larger and easier-to-click sidebar navigation.
          - Default English README plus complete [简体中文](https://github.com/javafancn/warp-ssh-manager/blob/main/README.zh-CN.md) documentation.
          - Existing SSH settings, saved credentials and prior flat groups remain compatible; no new database migration is needed.

          ### Installation
          Download the appropriate DMG attached below: **Apple Silicon** or **Intel**. Install [Warp Terminal](https://www.warp.dev/) separately.

          ### Notes
          Both installers target macOS 12+ and are ad-hoc-signed, **not Apple-notarized**. CI tests and packaging checks do not verify all real-world SSH password auto-login or Warp SSH enhancement behaviors; sudo passwords remain copy-only.

          ### 中文更新摘要
          新增多级嵌套分组、层级编辑和循环保护，并优化新建分组弹窗、侧栏字体及整行点击区域；README 默认英文，可以切换到[简体中文](https://github.com/javafancn/warp-ssh-manager/blob/main/README.zh-CN.md)。

          Full documentation: [English](https://github.com/javafancn/warp-ssh-manager/blob/main/README.md) · [简体中文](https://github.com/javafancn/warp-ssh-manager/blob/main/README.zh-CN.md)
          NOTES
          gh release create v1.0.1 \
            release-assets/WarpSSHManager-1.0.1-apple-silicon.dmg \
            release-assets/WarpSSHManager-1.0.1-intel.dmg \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Warp SSH Manager v1.0.1" --notes-file release-notes.md --latest
 || true)"
          [[ -z "$tag_sha" || "$tag_sha" == "$GITHUB_SHA" ]] || {
            echo "Refusing release: v1.0.1 tag points at $tag_sha" >&2; exit 1;
          }
          cat > release-notes.md <<'NOTES'
          ## Warp SSH Manager v1.0.1

          This release brings nested SSH host groups and an improved native macOS interface.

          ### What's new
          - Nested groups with tree expansion, subgroups, group rename and relocation.
          - Parent group filtering and host counts include all descendants.
          - Safeguards against duplicate sibling names, cyclic hierarchy changes, and deleting groups with children.
          - Polished group creation/editing sheet, custom parent picker, larger and easier-to-click sidebar navigation.
          - Default English README plus complete [简体中文](https://github.com/javafancn/warp-ssh-manager/blob/main/README.zh-CN.md) documentation.
          - Existing SSH settings, saved credentials and prior flat groups remain compatible; no new database migration is needed.

          ### Installation
          Download the appropriate DMG attached below: **Apple Silicon** or **Intel**. Install [Warp Terminal](https://www.warp.dev/) separately.

          ### Notes
          Both installers target macOS 12+ and are ad-hoc-signed, **not Apple-notarized**. CI tests and packaging checks do not verify all real-world SSH password auto-login or Warp SSH enhancement behaviors; sudo passwords remain copy-only.

          ### 中文更新摘要
          新增多级嵌套分组、层级编辑和循环保护，并优化新建分组弹窗、侧栏字体及整行点击区域；README 默认英文，可以切换到[简体中文](https://github.com/javafancn/warp-ssh-manager/blob/main/README.zh-CN.md)。

          Full documentation: [English](https://github.com/javafancn/warp-ssh-manager/blob/main/README.md) · [简体中文](https://github.com/javafancn/warp-ssh-manager/blob/main/README.zh-CN.md)
          NOTES
          gh release create v1.0.1 \
            release-assets/WarpSSHManager-1.0.1-apple-silicon.dmg \
            release-assets/WarpSSHManager-1.0.1-intel.dmg \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Warp SSH Manager v1.0.1" --notes-file release-notes.md --latest
