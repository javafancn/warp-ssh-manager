name: Rust checks
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all
      - run: cargo test -p wsm-core -p wsm-cli
      - run: cargo clippy -p wsm-core -p wsm-cli --all-targets
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check GPUI desktop
        shell: bash
        run: |
          set -o pipefail
          cargo check -p wsm-desktop --features tray 2>&1 | tee macos-gui-check.log
      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-compiler-diagnostics
          path: macos-gui-check.log
          if-no-files-found: warn
      - run: bash scripts/macos-smoke.sh
