name: Rust checks
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all
      - run: cargo test -p wsm-core -p wsm-cli
      - run: cargo clippy -p wsm-core -p wsm-cli --all-targets
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p wsm-desktop --features tray
      - run: bash scripts/macos-smoke.sh
