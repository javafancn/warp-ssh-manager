[workspace]
members = ["crates/wsm-core", "crates/wsm-cli"]
resolver = "2"

[workspace.package]
version = "1.0.3"
edition = "2021"
license = "MIT"
authors = ["Warp SSH Manager contributors"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
glob = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
